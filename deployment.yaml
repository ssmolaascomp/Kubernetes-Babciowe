apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-page
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-page
  template:
    metadata:
      labels:
        app: nginx-page
    spec:
      containers:
      - name: nginx-page
        image: ssmola123/nginx-page:v2
        ports:
        - containerPort: 80
